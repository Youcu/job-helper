<title>백엔드 신입 공고 45건</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f6f8fa; --surface:#ffffff; --surface-2:#f0f3f7;
  --ink:#14181d; --ink-2:#39424e; --dim:#626d7c; --line:#dfe4ea; --line-2:#c9d1db;
  --accent:#2f5a80; --accent-soft:#e6eef6; --accent-ink:#1f3f5c;
  --good:#2a6a4b; --good-soft:#e3f1e9;
  --mid:#7d6212; --mid-soft:#f7efd9;
  --star:#b07c17;
  --r:3px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0f1216; --surface:#161a20; --surface-2:#1d222a;
    --ink:#e5e9ef; --ink-2:#bcc5d1; --dim:#8b96a5; --line:#262d36; --line-2:#333c47;
    --accent:#7fadd6; --accent-soft:#1b2a38; --accent-ink:#a9c9e6;
    --good:#6cc094; --good-soft:#17291f;
    --mid:#d6ab4a; --mid-soft:#2a2313;
    --star:#d8a63c;
  }
}
:root[data-theme="dark"]{
  --ground:#0f1216; --surface:#161a20; --surface-2:#1d222a;
  --ink:#e5e9ef; --ink-2:#bcc5d1; --dim:#8b96a5; --line:#262d36; --line-2:#333c47;
  --accent:#7fadd6; --accent-soft:#1b2a38; --accent-ink:#a9c9e6;
  --good:#6cc094; --good-soft:#17291f;
  --mid:#d6ab4a; --mid-soft:#2a2313;
  --star:#d8a63c;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:14px; line-height:1.6; word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding-inline:18px; padding-block:0 64px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}

/* ── 머리 ── */
header.top{padding-block:34px 20px; border-bottom:2px solid var(--ink)}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim); margin:0 0 8px}
h1{margin:0; font-size:27px; font-weight:700; letter-spacing:-.5px; text-wrap:balance; line-height:1.25}
.lede{margin:9px 0 0; color:var(--ink-2); max-width:62ch}
.gates{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--dim)}
.gates span{border:1px solid var(--line); border-radius:var(--r); padding:2px 8px; background:var(--surface)}
.gates span b{color:var(--ink-2); font-weight:600}
.gates i{font-style:normal; color:var(--line-2); align-self:center}

/* ── 기술 빈도 ── */
.freq{margin-top:26px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r)}
.freq h2{margin:0; padding:11px 15px; font-size:12px; font-weight:600; letter-spacing:.04em;
  color:var(--dim); border-bottom:1px solid var(--line); text-transform:none}
.freq ol{list-style:none; margin:0; padding:9px 15px 13px; display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px 26px}
.freq li{display:grid; grid-template-columns:8.5em 2.4em 1fr; align-items:center; gap:9px; padding-block:2.5px}
.freq b{font-weight:500; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.freq em{font-style:normal; font-size:12px; color:var(--dim); text-align:right}
.freq .track{height:7px; background:var(--surface-2); border-radius:1px; overflow:hidden}
.freq .track i{display:block; height:100%; background:var(--accent); opacity:.8}

/* ── 조작 ── */
.controls{position:sticky; top:0; z-index:5; background:var(--ground);
  padding-block:13px; margin-top:26px; border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:9px; align-items:center}
.controls input[type=search]{
  flex:1 1 210px; min-width:0; font:inherit; font-size:13px; padding:7px 11px;
  border:1px solid var(--line-2); border-radius:var(--r); background:var(--surface); color:var(--ink)}
.seg{display:flex; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.seg button{font:inherit; font-size:12.5px; padding:6.5px 11px; border:0; background:transparent;
  color:var(--dim); cursor:pointer; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.count{margin-left:auto; flex:0 0 auto; padding-left:4px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--dim)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.chipbar{display:none; gap:7px; align-items:center; padding-block:10px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); font-size:12.5px; color:var(--dim)}
.chipbar.on{display:flex}
.chipbar button{font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--accent);
  background:var(--accent-soft); color:var(--accent-ink); border-radius:var(--r); cursor:pointer}

/* ── 공고 ── */
ul.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0}
li.row{border-bottom:1px solid var(--line); padding-block:15px}
.rowhead{display:grid; grid-template-columns:1fr auto; gap:5px 14px; align-items:start}
.co{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--dim);
  letter-spacing:.02em; margin:0 0 2px}
.name{margin:0; font-size:15.5px; font-weight:600; line-height:1.42; letter-spacing:-.2px}
.name a{color:var(--ink); text-decoration:none; background-image:linear-gradient(var(--line-2),var(--line-2));
  background-size:100% 1px; background-position:0 100%; background-repeat:no-repeat; padding-bottom:1px}
.name a:hover{color:var(--accent); background-image:linear-gradient(var(--accent),var(--accent))}
.side{display:flex; align-items:center; gap:7px}
.rate{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600; padding:2px 8px;
  border-radius:var(--r); white-space:nowrap}
.rate.hi{background:var(--good-soft); color:var(--good)}
.rate.lo{background:var(--mid-soft); color:var(--mid)}
.star{border:1px solid var(--line-2); background:var(--surface); color:var(--line-2);
  width:27px; height:27px; border-radius:var(--r); cursor:pointer; font-size:14px; line-height:1;
  display:grid; place-items:center; padding:0}
.star[aria-pressed="true"]{color:var(--star); border-color:var(--star)}

.meta{display:flex; flex-wrap:wrap; gap:3px 13px; margin-top:8px;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--dim)}
.meta span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.meta .due{color:var(--ink-2); font-weight:500}

.chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:9px}
.chips button{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:2px 7px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  border-radius:var(--r); cursor:pointer; line-height:1.55}
.chips button:hover{border-color:var(--accent); color:var(--accent)}
.chips button.hit{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); font-weight:500}

.more{margin-top:10px; font:inherit; font-size:12px; color:var(--accent); background:none;
  border:0; padding:0; cursor:pointer; font-family:"IBM Plex Mono",monospace}
.more::before{content:"▸ "; }
.row.open .more::before{content:"▾ "}

.gate{margin-top:13px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.gate[hidden]{display:none}
.gate section{background:var(--surface); padding:12px 14px; min-width:0}
.gate h3{margin:0 0 7px; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:600}
.gate h3 b{display:block; font-family:"IBM Plex Sans KR",sans-serif; font-size:12.5px;
  letter-spacing:0; text-transform:none; color:var(--ink-2); font-weight:600; margin-top:2px}
.gate p{margin:0; font-size:13px; color:var(--ink-2); white-space:pre-wrap; line-height:1.68;
  max-height:22em; overflow-y:auto}
.gate p.none{color:var(--dim); font-style:italic; white-space:normal}

.empty{padding:40px 0; text-align:center; color:var(--dim)}
footer{margin-top:30px; padding-top:14px; border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--dim); line-height:1.8}

@media (max-width:620px){
  .freq ol{grid-template-columns:1fr}
  .gate{grid-template-columns:1fr}
  .rowhead{grid-template-columns:1fr}
  .side{justify-content:flex-start}
  .count{margin-left:0; width:100%}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
<div class="wrap">
<header class="top">
  <p class="eyebrow">__SOURCE__</p>
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>
  <div class="gates" id="gates"></div>
</header>

<div class="freq">
  <h2 id="freqhead"></h2>
  <ol id="freq"></ol>
</div>

<div class="controls">
  <input type="search" id="q" placeholder="기업 · 공고 · 기술 · 근무지 검색" autocomplete="off">
  <div class="seg" id="siteSeg" role="group" aria-label="사이트"></div>
  <div class="seg" id="sortSeg" role="group" aria-label="정렬">
    <button type="button" data-sort="rate" aria-pressed="true">평점순</button>
    <button type="button" data-sort="due" aria-pressed="false">마감 임박순</button>
    <button type="button" data-sort="co" aria-pressed="false">기업명</button>
  </div>
  <span class="count" id="count"></span>
</div>

<div class="chipbar" id="chipbar">
  <span>기술 필터</span><span id="chipnames"></span>
  <button type="button" id="clearchip">모두 해제</button>
</div>

<ul class="list" id="list"></ul>
<p class="empty" id="empty" hidden>조건에 맞는 공고가 없습니다.</p>

<footer>
  평점은 잡플래닛 기업 평점. 2.9 미만은 앞 단계에서 이미 걸러졌다.<br>
  <b>기본역량</b>은 공고의 지원자격, <b>경쟁력</b>은 우대사항이다. 빈 칸은 공고에 그 절이 없었다는 뜻 — 채워 넣지 않는다.<br>
  ★ 표시는 이 브라우저에만 남는다.
</footer>
</div>

<script>
const DATA = __DATA__;
const FUNNEL = __FUNNEL__;

/* ── 거르기 눈금 — 몇 건이 어디서 빠졌나 ── */
document.getElementById('gates').innerHTML = FUNNEL.map(([label, n]) =>
  '<span>' + esc(label) + (n === null ? '' : ' <b>' + n + '</b>') + '</span>'
).join('<i>\u203a</i>');

/* ── 기술 빈도 ── */
const freq = {};
DATA.forEach(d => d.tech.forEach(t => freq[t] = (freq[t]||0)+1));
const TOP_N = 14;
const topTech = Object.entries(freq).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0])).slice(0,TOP_N);
document.getElementById('freqhead').textContent =
  '이 ' + DATA.length + '건이 요구한 기술 — 상위 ' + topTech.length
  + '가지 (전체 ' + Object.keys(freq).length + '가지)';
const max = topTech.length ? topTech[0][1] : 1;
document.getElementById('freq').innerHTML = topTech.map(([name,n]) =>
  `<li><b title="${esc(name)}">${esc(name)}</b><em class="mono">${n}건</em>`
  + `<span class="track"><i style="width:${Math.round(n/max*100)}%"></i></span></li>`).join('');

/* ── 상태 ── */
const sites = [...new Set(DATA.map(d=>d.site))].sort();
let state = {q:'', site:'', sort:'rate', chips:new Set()};
let picked = load();

document.getElementById('siteSeg').innerHTML =
  [['','전체'], ...sites.map(s=>[s,s])].map(([v,l],i)=>
    `<button type="button" data-site="${esc(v)}" aria-pressed="${i===0}">${esc(l)}</button>`).join('');

/* ── 그리기 ── */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dueKey(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : '9999-99-99'; }

function visible(){
  const q = state.q.trim().toLowerCase();
  return DATA.filter(d=>{
    if (state.site && d.site !== state.site) return false;
    for (const c of state.chips) if (!d.tech.includes(c)) return false;
    if (!q) return true;
    return (d.co+' '+d.title+' '+d.loc+' '+d.tech.join(' ')+' '+d.req+' '+d.pref).toLowerCase().includes(q);
  }).sort((a,b)=>{
    if (state.sort==='rate') return (+b.rate||0)-(+a.rate||0) || a.co.localeCompare(b.co,'ko');
    if (state.sort==='due')  return dueKey(a.due).localeCompare(dueKey(b.due)) || a.co.localeCompare(b.co,'ko');
    return a.co.localeCompare(b.co,'ko');
  });
}

function render(){
  const rows = visible();
  const list = document.getElementById('list');
  list.innerHTML = rows.map(d=>{
    const id = d.url;
    const hi = (+d.rate||0) >= 3.5;
    const meta = [
      d.site, d.career,
      d.due ? `<span class="due">마감 ${esc(d.due)}</span>` : '',
      d.loc ? d.loc.split(' ').slice(0,3).join(' ') : '',
      d.pay || ''
    ].filter(Boolean).map(x => x.startsWith('<') ? x : `<span>${esc(x)}</span>`).join('');
    return `<li class="row" data-id="${esc(id)}">
      <div class="rowhead">
        <div>
          <p class="co">${esc(d.co)}</p>
          <h2 class="name"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></h2>
        </div>
        <div class="side">
          <span class="rate ${hi?'hi':'lo'}">${esc(d.rate)}</span>
          <button type="button" class="star" data-star="${esc(id)}"
            aria-pressed="${picked.has(id)}" aria-label="관심 표시">★</button>
        </div>
      </div>
      <div class="meta">${meta}</div>
      <div class="chips">${d.tech.map(t=>
        `<button type="button" data-chip="${esc(t)}" class="${state.chips.has(t)?'hit':''}">${esc(t)}</button>`).join('')}</div>
      <button type="button" class="more" data-more>지원 조건 보기</button>
      <div class="gate" hidden>
        <section><h3>지원자격<b>기본역량 게이트</b></h3>
          ${d.req ? `<p>${esc(d.req)}</p>` : `<p class="none">공고에 지원자격 절이 없었다.</p>`}</section>
        <section><h3>우대사항<b>경쟁력 게이트</b></h3>
          ${d.pref ? `<p>${esc(d.pref)}</p>` : `<p class="none">공고에 우대사항 절이 없었다.</p>`}</section>
      </div>
    </li>`;
  }).join('');
  document.getElementById('empty').hidden = rows.length > 0;
  document.getElementById('count').textContent =
    rows.length === DATA.length ? `${DATA.length}건` : `${rows.length} / ${DATA.length}건`;
  const cb = document.getElementById('chipbar');
  cb.classList.toggle('on', state.chips.size > 0);
  document.getElementById('chipnames').textContent = [...state.chips].join(' · ');
}

/* ── 조작 ── */
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.getElementById('siteSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-site]'); if (!b) return;
  state.site = b.dataset.site;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
document.getElementById('sortSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  state.sort = b.dataset.sort;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
document.getElementById('clearchip').addEventListener('click', () => { state.chips.clear(); render(); });
document.getElementById('list').addEventListener('click', e => {
  const chip = e.target.closest('[data-chip]');
  if (chip) { const t = chip.dataset.chip;
    state.chips.has(t) ? state.chips.delete(t) : state.chips.add(t); render(); return; }
  const star = e.target.closest('[data-star]');
  if (star) { const id = star.dataset.star;
    picked.has(id) ? picked.delete(id) : picked.add(id);
    star.setAttribute('aria-pressed', picked.has(id)); save(); return; }
  const more = e.target.closest('[data-more]');
  if (more) { const row = more.closest('.row'); const gate = row.querySelector('.gate');
    gate.hidden = !gate.hidden; row.classList.toggle('open', !gate.hidden);
    more.textContent = gate.hidden ? '지원 조건 보기' : '지원 조건 접기'; }
});

/* ── 관심 표시는 이 브라우저에만 ── */
function load(){ try { return new Set(JSON.parse(localStorage.getItem('picked')||'[]')); }
                catch(e){ return new Set(); } }
function save(){ try { localStorage.setItem('picked', JSON.stringify([...picked])); } catch(e){} }

render();
</script>
